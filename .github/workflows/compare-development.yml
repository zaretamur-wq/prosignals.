name: ProSignals EURUSD comparison runner
on:
  push:
    branches: [main]
    paths: [.github/workflows/compare-development.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measured-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development/shared-backtesting-risk
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest test_forex_chart_patterns -v
      - name: Download real EURUSD candles
        run: |
          python - <<'PY'
          import pandas as pd, yfinance as yf
          df=yf.download('EURUSD=X',period='59d',interval='5m',auto_adjust=True,progress=False,threads=False)
          if df.empty: raise RuntimeError('No market data')
          if isinstance(df.columns,pd.MultiIndex): df.columns=df.columns.get_level_values(0)
          df=df.rename(columns=str.lower)[['open','high','low','close']].dropna().reset_index()
          df.rename(columns={df.columns[0]:'time'},inplace=True)
          df['time']=pd.to_datetime(df.time,utc=True)
          if df.time.iloc[-1]+pd.Timedelta(minutes=5)>pd.Timestamp.now(tz='UTC'):df=df.iloc[:-1]
          if len(df)<1000:raise RuntimeError('Insufficient actual candles')
          df.to_csv('eurusd_real_5m.csv',index=False)
          print('Bars:',len(df))
          PY
      - run: python compare_original_patterns.py --csv eurusd_real_5m.csv --symbol EURUSD --risk 0.03 --rr 2 --output comparison_results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forex-measured-comparison
          path: comparison_results.json
          if-no-files-found: ignore
          retention-days: 14
