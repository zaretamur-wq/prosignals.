name: Forex research tests
on:
  push:
    branches:
      - development/shared-backtesting-risk
  pull_request:
    branches:
      - development/shared-backtesting-risk
jobs:
  forex-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pandas
      - run: python -m unittest discover -p 'test_forex*.py' -v
