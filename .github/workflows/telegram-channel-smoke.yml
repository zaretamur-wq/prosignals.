name: Telegram public channel smoke test (temporary)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/telegram-channel-smoke.yml

permissions:
  contents: read

jobs:
  check:
    if: contains(github.event.head_commit.message, '[telegram-smoke-test]')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check channel can receive one non-trading message
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.error, sys
          token = os.environ.get("TG_TOKEN")
          if not token:
              print("Telegram bot token unavailable")
              sys.exit(1)
          payload = json.dumps({
              "chat_id": "@ProSignalsSignalsHub",
              "text": "🧪 ProSignals connection test: this is a system check, NOT a trading signal. Experimental/demo only."
          }).encode()
          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  result = json.load(response)
              if not result.get("ok"):
                  print("Telegram rejected connection test")
                  sys.exit(1)
              print("Telegram public channel message accepted")
          except urllib.error.HTTPError as ex:
              print("Telegram connection failed with HTTP", ex.code)
              sys.exit(1)
          except Exception as ex:
              print("Telegram connection test exception:", type(ex).__name__)
              sys.exit(1)
          PY
