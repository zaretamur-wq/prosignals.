name: ProSignals Development Tests

on:
  push:
    branches:
      - development/shared-backtesting-risk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q shared_risk.py shared_backtest.py historical_replay.py tests
      - name: Run paper-only unit tests
        run: python -m unittest discover -s tests -v
