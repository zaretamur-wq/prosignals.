name: ProSignals

on:
  schedule:
    - cron: "5,20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run signal bot
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          WA_PHONE: ${{ secrets.WA_PHONE }}
          WA_KEY: ${{ secrets.WA_KEY }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python signals.py

      - name: Save state
        run: |
          git config user.name "signals-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
