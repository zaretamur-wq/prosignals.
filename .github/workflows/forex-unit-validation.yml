name: Forex research unit tests

on:
  push:
    branches:
      - development/shared-backtesting-risk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install numpy pandas
      - name: Run Forex research tests
        run: python -m unittest discover -p 'test_forex_*.py' -v
