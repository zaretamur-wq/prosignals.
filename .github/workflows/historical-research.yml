name: ProSignals Historical Research Smoke Test

on:
  workflow_dispatch:
  push:
    branches:
      - development/shared-backtesting-risk
    paths:
      - research_data.py
      - historical_replay.py
      - shared_backtest.py
      - shared_risk.py
      - research_forex_sizing.py
      - research_margin.py
      - research_coverage.py
      - research_import.py
      - research_costs.py
      - research_audit.py
      - research_alert_gates.py
      - research_holdout.py
      - research_regimes.py
      - trade_lifecycle.py
      - .github/workflows/historical-research.yml

permissions:
  contents: read

jobs:
  historical-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - market: forex
            symbol: EURUSD
            file: EURUSD_1h.csv
            step: "0.01"
            min: "0.01"
            value: "100000"
            fee: "0"
            fee_rate: "0"
          - market: forex
            symbol: GOLD
            file: GOLD_1h.csv
            step: "0.01"
            min: "0.01"
            value: "100"
            fee: "0"
            fee_rate: "0"
          - market: crypto
            symbol: ETH
            file: ETH_5m.csv
            step: "0.00001"
            min: "0.00001"
            value: "1"
            fee: "0"
            fee_rate: "0.001"
          - market: crypto
            symbol: BTC
            file: BTC_5m.csv
            step: "0.000001"
            min: "0.000001"
            value: "1"
            fee: "0"
            fee_rate: "0.001"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download market candles
        run: python research_data.py --market "${{ matrix.market }}" --symbol "${{ matrix.symbol }}" --count 7000 --output "research/${{ matrix.file }}"
      - name: Replay original signal score
        run: |
          python historical_replay.py --market "${{ matrix.market }}" --symbol "${{ matrix.symbol }}" --csv "research/${{ matrix.file }}" --capital 100 --quantity-step "${{ matrix.step }}" --min-quantity "${{ matrix.min }}" --price-value "${{ matrix.value }}" --commission-per-unit-side "${{ matrix.fee }}" --slippage 0.0005 --fee-rate "${{ matrix.fee_rate }}" --report-dir "reports/${{ matrix.symbol }}" --compare-score-thresholds --compare-regimes --holdout --compare-alert-gates --cost-stress
      - name: Upload research logs and market candles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-${{ matrix.symbol }}
          path: |
            research/
            reports/
          if-no-files-found: ignore
          retention-days: 1
