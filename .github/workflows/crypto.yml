name: ProSignals Crypto

on:
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'prosignals-crypto-manual' || 'prosignals-crypto' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run crypto signal bot
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          WA_PHONE: ${{ secrets.WA_PHONE }}
          WA_KEY: ${{ secrets.WA_KEY }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python crypto_signals.py --loop 335

      - name: Save state
        if: always()
        run: |
          git config user.name "signals-bot"
          git config user.email "bot@users.noreply.github.com"
          git add crypto_state.json
          git diff --cached --quiet || (git commit -m "update crypto state" && git pull --rebase -q && git push)
